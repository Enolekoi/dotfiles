#------------ OPACITY SETTINGS ------------------
windowrule = match:class firefox, opacity 1.0 override 1.0 override
windowrule = match:class audacity, opacity 1.0 override 1.0 overrid

#------------ DEFAULT POSITION ------------------

# Browser
windowrule = match:class firefox, workspace 1
# Messager                
windowrule = match:class com.ktechpit.whatsie, workspace 8
windowrule = match:class org.telegram.desktop, workspace 8
windowrule = match:class discord, workspace 8
windowrule = match:class Microsoft Teams - Preview, workspace 8
# Media                   
windowrule = match:class tidal-hifi, workspace 9
windowrule = match:class Spotify, workspace 9
# Settings
windowrule = match:class nwg-displays, workspace 10
windowrule = match:class pavucontrol, workspace 10
# windowrule = match:class blueman-manager, workspace 10

#------------ Other -----------------------------
windowrule = match:class alacritty-dropdown, float 1
